[package]
name = "workctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "workctl command line interface"
license = "Apache-2.0"
repository = "https://github.com/cerebrai-app/workctl"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "3", features = ["platform-verifier"] }
zstd = "0.13"
