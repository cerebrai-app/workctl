name: Renovate

# Self-hosted Renovate. It opens PRs that bump the pinned GitHub Actions and the
# pinned ponytail plugin marketplace (see renovate.json).
#
# Needs a repository secret RENOVATE_TOKEN: a fine-grained personal access token
# (or GitHub App token) for this repository with read/write on Contents, Pull
# requests and Workflows, and read on Metadata. The built-in GITHUB_TOKEN cannot
# be granted the `workflows` permission, so it cannot update files under
# .github/workflows. Until the secret exists the job only prints a warning.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would change without opening PRs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Warn when RENOVATE_TOKEN is missing
        if: ${{ env.RENOVATE_TOKEN == '' }}
        run: echo "::warning::Secret RENOVATE_TOKEN is not set, so Renovate was skipped. See the comment at the top of .github/workflows/renovate.yml."

      - name: Run Renovate
        if: ${{ env.RENOVATE_TOKEN != '' }}
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ env.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: info
