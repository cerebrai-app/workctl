name: Renovate

# Self-hosted Renovate. It opens PRs that bump the pinned GitHub Actions and the
# pinned ponytail plugin marketplace (see renovate.json).
#
# Runs weekly, and can be started by hand from the Actions tab ("Run workflow",
# with an optional dry run that opens no PRs).
#
# Authenticates as a GitHub App rather than with a personal access token. Needs
# two secrets (repository or organization level):
#   RENOVATE_APP_CLIENT_ID    the app's Client ID (on its settings page, "Iv...")
#   RENOVATE_APP_PRIVATE_KEY  the app's private key (the whole .pem file)
# The app must be installed on this repository with read/write on Contents,
# Issues, Pull requests and Workflows, and read on Dependabot alerts (used for
# security updates). The built-in GITHUB_TOKEN cannot get the `workflows`
# permission, so it cannot update files under .github/workflows.
# Until the secrets exist the job only prints a warning.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would change without opening PRs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      APP_CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
    steps:
      - name: Warn when the app credentials are missing
        if: ${{ env.APP_CLIENT_ID == '' }}
        run: echo "::warning::Secret RENOVATE_APP_CLIENT_ID is not set, so Renovate was skipped. See the comment at the top of .github/workflows/renovate.yml."

      - name: Create app token
        id: app-token
        if: ${{ env.APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Only what Renovate needs, even if the app is granted more.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        if: ${{ steps.app-token.outputs.token != '' }}
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The Renovate image runs with the app token, so it is pinned by digest.
          # Renovate updates the version and digest together (see renovate.json).
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate versioning=semver
          renovate-version: 44.225.1@sha256:eec896cbc3a745b5144c1547360e8197efcd0f949a688a8a63605ee4db8590d0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: info
