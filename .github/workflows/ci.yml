name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cerebrai-app/actions/setup-rust@57b263623437524d4a872fe0b268b94e96d0b046 # v1.0.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cerebrai-app/actions/setup-rust@57b263623437524d4a872fe0b268b94e96d0b046 # v1.0.0
      - run: cargo build --locked --release
      - run: cargo test --locked

  # Build and test with exactly the `rust-version` from Cargo.toml, so the
  # declared minimum is a tested one. Rust has no LTS channel; this floor is the
  # oldest release our dependencies support.
  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cerebrai-app/actions/setup-rust@57b263623437524d4a872fe0b268b94e96d0b046 # v1.0.0
        with:
          toolchain: msrv
      - run: cargo test --locked

  # There is no arm64 Linux runner here, so the unit tests and a `version` smoke
  # test run under QEMU user-mode emulation, with the arm64 libc from the cross
  # toolchain. (The integration tests start the binary themselves, which would
  # need binfmt registration, so only the unit tests run here.)
  test-arm64:
    name: Test (arm64 Linux under QEMU)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cerebrai-app/actions/setup-rust@57b263623437524d4a872fe0b268b94e96d0b046 # v1.0.0
        with:
          cross-aarch64-linux: 'true'
          cache-key: aarch64-unknown-linux-gnu
      - run: cargo test --locked --target aarch64-unknown-linux-gnu --bins
      - run: cargo run --locked --target aarch64-unknown-linux-gnu -- version
