name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# The two reviews are separate jobs so they run in parallel and one failing
# doesn't stop the other.
jobs:
  ponytail-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # The action only accepts marketplace URLs ending in .git, which can't carry
      # a ref, so the ponytail marketplace is checked out at a pinned commit and
      # passed as a local path instead. Renovate keeps `ref` up to date.
      - name: Checkout ponytail plugin marketplace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: DietrichGebert/ponytail
          # renovate: datasource=github-tags depName=DietrichGebert/ponytail
          ref: 7801d061243d7b753bad0e0b3c057cd250b11755 # v5.3.3
          path: .marketplaces/ponytail
          fetch-depth: 1
          persist-credentials: false

      - name: Run ponytail review
        id: ponytail-review
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.marketplaces/ponytail
          plugins: 'ponytail@ponytail'
          prompt: |
            /ponytail:ponytail-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            When the review is done, post the full report as a single comment on the pull request with `gh pr comment`.
            Start the comment with the line `<!-- ponytail-review -->` (an HTML comment, not shown on the page), then the report.
          claude_args: '--allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Not pinned: the action only takes URLs ending in .git (no ref), and Claude Code
          # rejects a local copy of the reserved `claude-code-plugins` marketplace name.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  # Collapse earlier ponytail reports as "outdated", so only the newest one stays
  # open on the PR. A separate job on purpose: it needs write access to comments,
  # and the job that runs the third-party plugin should not have that. It runs
  # only after a successful review, so a failed review never hides the last report.
  minimize-old-ponytail-reviews:
    needs: ponytail-review
    if: ${{ needs.ponytail-review.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Minimize all but the newest ponytail report
        run: |
          set -euo pipefail
          # Ponytail reports are claude[bot] comments that start with the marker.
          # Reports posted before the marker existed are recognised by their
          # closing "Verdict" and "Lean:" lines.
          select='.[] | select(.user.login == "claude[bot]")
            | select((.body | startswith("<!-- ponytail-review -->"))
                     or ((.body | contains("Verdict")) and (.body | contains("Lean:"))))
            | [.created_at, .node_id, .id] | @tsv'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq "$select" | sort > reports.tsv
          echo "$(wc -l < reports.tsv) ponytail report(s) on #$PR_NUMBER"
          # Everything except the newest (the last line after sorting by time).
          head -n -1 reports.tsv | while IFS=$'\t' read -r created node_id id; do
            gh api graphql \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
              -f id="$node_id" > /dev/null
            echo "minimized comment $id ($created)"
          done
